name: Matrix Demo
on: push
jobs:
    build:
        strategy:
            matrix:
                node-version: [20, 22]
                operating-system: [ubuntu-latest]
        runs-on: ${{matrix.operating-system}}
        steps:
            - name: Get code
              uses: actions/checkout@v6
            - name: Install NodeJS
              uses: actions/setup-node@v6
              with:
                node-version: ${{matrix.node-version}}
            - name: Install Dependencies
              run: npm ci
            - name: Build Project
              run: npm run build